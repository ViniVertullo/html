<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mídia em HTML — Boxe</title>
</head>
<body>

  <h1>🥊 Boxe</h1>
  <p>Vídeo, áudio, YouTube e PDF em uma única página.</p>

  <!-- ===== VÍDEO ===== -->
  <h2>Nosso vídeo</h2>
  <video width="640" height="360" controls poster="imagem/poster.jpg" preload="metadata" autoplay muted loop poster="video/poster.jpg">
    <source src="video/boxe.mp4" type="video/mp4">
    <source src="video/boxe.webm" type="video/webm">
    <track src="video/legenda.vtt" kind="subtitles" srclang="pt" label="Português" default>
    Seu navegador não suporta vídeo.
    <a href="video/boxe.mp4">Baixe o vídeo (MP4)</a>.
  </video>

  <!-- ===== ÁUDIO ===== -->
  <h2>Trilha Sonora</h2>
  <audio controls>
    <source src="audio/rocky.mp4" type="audio/mp4">
    Seu navegador não suporta áudio.
    <a href="audio/rocky.mp3">Baixe a trilha sonora (MP3)</a>.
  </audio>

  <!-- ===== YOUTUBE ===== -->
  <h2>Vídeo do YouTube</h2>
  <!-- Troque SEU_ID_DO_VIDEO pelo código que aparece depois de "v=" no endereço do vídeo -->
<iframe width="560" height="315" src="https://www.youtube.com/embed/BQduwygpHRU?si=InmXb56qlfoLrk40" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  <!-- ===== PDF ===== -->
  <h2>Plano de treino</h2>
  <object data="docs/plano.png" type="application/pdf" width="780" height="410">
    Seu navegador não mostra PDF aqui.
    <a href="docs/plano.pdf">Abra o cardápio em PDF</a>.
  </object>
  <a href="../index.html"><button>Voltar</button></a>

</body>
</html>
